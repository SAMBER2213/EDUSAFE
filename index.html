<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduSafe – Capacitación en prevención de riesgos</title>
<style>
:root{--v:#0a8a3c;--vo:#066b2d;--a:#ffd400;--c:#eaf7ee;--t:#14301f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--c);color:var(--t);font-size:20px;line-height:1.45}
header{background:var(--v);border-bottom:8px solid var(--a);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
header img{height:64px;background:#fff;border-radius:12px;padding:4px}
header b{font-size:24px;display:block}
header small{font-size:15px;opacity:.9}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:34px;margin:8px 0;color:var(--vo)}
h2{font-size:26px;margin:6px 0;color:var(--vo)}
.big{display:block;width:100%;margin:12px 0;padding:18px;border:0;border-radius:20px;font:inherit;font-weight:700;font-size:24px;background:#fff;color:var(--t);box-shadow:0 4px 0 #b9dcc3;cursor:pointer;text-align:left}
.big:hover,.big:focus-visible{background:var(--a);outline:3px solid var(--vo)}
.go{background:var(--v);color:#fff;text-align:center;box-shadow:0 4px 0 var(--vo)}
.go:hover,.go:focus-visible{background:var(--vo);color:#fff}
.small{background:none;border:0;font:inherit;font-size:16px;color:var(--vo);text-decoration:underline;cursor:pointer;margin:6px 10px 0 0}
.bar{background:#fff;border:3px solid var(--v);border-radius:30px;height:34px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a);transition:width .5s}
.card{background:#fff;border-radius:20px;padding:14px 18px;margin:14px 0;border-left:12px solid var(--v)}
.card.d{border-color:var(--a)}.card.p{border-color:#2f8fd8}.card.t{border-color:#e0559b;background:#fff7fb}
.card ul{margin:6px 0;padding-left:22px}.card li{margin:8px 0}
.ok{background:#c9f0d4!important}.no{background:#ffd6d6!important}
.fb{background:#fffbe0;border-radius:16px;padding:12px 16px;margin:10px 0}
input{width:100%;font:inherit;font-size:24px;padding:14px;border:3px solid var(--v);border-radius:16px;margin:10px 0}
.hero{font-size:64px;text-align:center}
</style>
</head>
<body>
<header><img id="logo" alt="Logo Institución Educativa Antonia Santos"><div><b>EduSafe</b><small>I.E. Antonia Santos</small></div></header>
<main id="app"></main>

  a:["Aprende el número de emergencias: 123.","Conoce tu ruta de evacuación y el punto de encuentro.","Pregunta dónde está el botiquín."],
  d:["Si hay inundación, sube a un lugar alto y aléjate del agua que corre.","Si alguien se lastima, avisa a un adulto de inmediato.","Sigue siempre las instrucciones de tus profes."],
  p:["No toques cables ni agua sucia.","Cuéntale a un adulto lo que pasó.","Vuelve solo cuando te digan que es seguro."],
  t:{est:"Si ves a alguien herido, no lo muevas: llama a un adulto.",doc:"Tenga a mano la lista de estudiantes y los teléfonos de emergencia.",pad:"Mantenga sus datos de contacto al día en el colegio.",inv:"Pregunte en la entrada por la ruta de evacuación."},
  q:[["Alguien se cayó y se lastimó. ¿Qué haces primero?",["Lo muevo rápido","Aviso a un adulto","Me voy"],1,"Un adulto sabrá cómo ayudar sin hacerle más daño."],
     ["Hay una inundación. ¿A dónde vas?",["A un lugar alto y seguro","Al sótano","Camino por el agua"],0,"El agua corre fuerte. ¡Sube y aléjate!"],
     ["¿Por qué es importante conocer la ruta de evacuación?",["Para decorar el colegio","Para salir rápido y seguro","No sirve para nada"],1,"Si la conoces, no pierdes tiempo en una emergencia."],
     ["¿Puedes tocar cables caídos?",["Sí","Nunca","Solo con zapatos"],1,"¡Nunca! Pueden dar corriente. Avisa a un adulto."]]}
];

let S = {perfil:null,done:{},nombre:"",code:""};
try{ const g=localStorage.getItem("edusafe"); if(g) S=Object.assign(S,JSON.parse(g)); }catch(e){}
function save(){ try{ localStorage.setItem("edusafe",JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const app = $("app");
const hechos = () => M.filter(m=>S.done[m.id]).length;
function show(h){ app.innerHTML=h; window.scrollTo(0,0); }

function pantallaPerfil(){
  show(`<div class="hero">🛡️</div><h1>¡Hola! Aprende a cuidarte</h1>
  <p>Vamos a aprender qué hacer en un temblor, un incendio y otras emergencias. ¿Quién eres?</p>`
  + Object.keys(PERFILES).map(k=>`<button class="big" onclick="elegir('${k}')">${PERFILES[k][0]} ${PERFILES[k][1]}</button>`).join(""));
}
function elegir(k){ S.perfil=k; save(); inicio(); }

function inicio(){
  const n=hechos(), pct=Math.round(n/M.length*100);
  show(`<h1>${PERFILES[S.perfil][0]} ${NOMBRE_PERFIL[S.perfil]}</h1>
  <p>Tu avance: <b>${n} de ${M.length}</b> temas</p>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <h2>Elige un tema</h2>`
  + M.map(m=>`<button class="big ${S.done[m.id]?'ok':''}" onclick="modulo('${m.id}')">${m.ico} ${m.n} ${S.done[m.id]?'✅':''}</button>`).join("")
  + (n===M.length?`<button class="big go" onclick="final()">🏆 ¡Recibe tu certificado!</button>`:"")
  + `<button class="small" onclick="pantallaPerfil()">Cambiar perfil</button><button class="small" onclick="reiniciar()">Empezar de nuevo</button>`);
}
function reiniciar(){ if(confirm("¿Quieres borrar tu avance y empezar de nuevo?")){ S={perfil:S.perfil,done:{},nombre:"",code:""}; save(); inicio(); } }

const li = a => "<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>";
function modulo(id){
  const m=M.find(x=>x.id===id);
  show(`<button class="small" onclick="inicio()">⬅ Volver</button>
  <h1>${m.ico} ${m.n}</h1>
  <div class="card"><h2>🟢 Antes</h2>${li(m.a)}</div>
  <div class="card d"><h2>🟡 Durante</h2>${li(m.d)}</div>
  <div class="card p"><h2>🔵 Después</h2>${li(m.p)}</div>
  <div class="card t"><h2>⭐ Para ti</h2><p>${m.t[S.perfil]}</p></div>
  <button class="big go" onclick="quiz('${id}',0,0)">¡Hacer el juego de preguntas!</button>`);
}

function quiz(id,i,pts){
  const m=M.find(x=>x.id===id);
  if(i>=m.q.length) return resultado(m,pts);
  const q=m.q[i];
  show(`<p>Pregunta <b>${i+1}</b> de ${m.q.length}</p><h2>${q[0]}</h2>`
  + q[1].map((o,j)=>`<button class="big" id="o${j}" onclick="resp('${id}',${i},${pts},${j})">${o}</button>`).join("")
  + `<div id="fb"></div>`);
}
function resp(id,i,pts,j){
  const q=M.find(x=>x.id===id).q[i], bien=j===q[2];
  document.querySelectorAll(".big").forEach(b=>b.disabled=true);
  $("o"+j).classList.add(bien?"ok":"no"); $("o"+q[2]).classList.add("ok");
  $("fb").innerHTML=`<div class="fb">${bien?"🎉 ¡Muy bien! ":"🤔 Casi. "}${q[3]}</div><button class="big go" onclick="quiz('${id}',${i+1},${pts+(bien?1:0)})">Seguir</button>`;
}
function resultado(m,pts){
  const pct=Math.round(pts/m.q.length*100), pasa=pct>=70;
  if(pasa){ S.done[m.id]=true; save(); }
  show(`<div class="hero">${pasa?"🌟":"💪"}</div><h1>${pts} de ${m.q.length} correctas (${pct} %)</h1>
  <p>${pasa?"¡Felicitaciones! Superaste este tema.":"¡Casi lo logras! Necesitas al menos 70 %. Lee otra vez y vuelve a intentarlo."}</p>`
  + (pasa?`<button class="big go" onclick="inicio()">Seguir</button>`:`<button class="big go" onclick="modulo('${m.id}')">Repasar e intentar otra vez</button>`));
}

function final(){
  show(`<div class="hero">🏆</div><h1>¡Terminaste la capacitación!</h1>
  <div class="card t"><p>${MENSAJE[S.perfil]}</p></div>
  <p>Escribe tu nombre para tu certificado:</p>
  <input id="nom" maxlength="40" placeholder="Tu nombre completo" value="${S.nombre.replace(/"/g,"")}">
  <button class="big go" onclick="certificado()">📄 Descargar mi certificado (PDF)</button>
  <button class="small" onclick="inicio()">⬅ Volver</button>`);
}

function codigo(){
  const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<8;i++) s+=c[Math.floor(Math.random()*c.length)];
  return "ES-"+s.slice(0,4)+"-"+s.slice(4);
}
function certificado(){
  const nom=$("nom").value.trim();
  if(!nom){ alert("Escribe tu nombre primero 😊"); $("nom").focus(); return; }
  S.nombre=nom; if(!S.code) S.code=codigo(); save();
  const img=new Image();
  img.onload=()=>{
    const W=1684,H=1190,c=document.createElement("canvas"); c.width=W; c.height=H;
    const x=c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,W,H);
    x.strokeStyle="#0a8a3c"; x.lineWidth=22; x.strokeRect(34,34,W-68,H-68);
    x.strokeStyle="#ffd400"; x.lineWidth=8; x.strokeRect(64,64,W-128,H-128);
    const lh=190, lw=img.width*lh/img.height; x.drawImage(img,(W-lw)/2,95,lw,lh);
    x.textAlign="center"; const F='"Trebuchet MS","Segoe UI",Arial,sans-serif';
    const t=(s,y,sz,col,w)=>{x.font=(w||"")+" "+sz+"px "+F;x.fillStyle=col;x.fillText(s,W/2,y);};
    t("Institución Educativa Antonia Santos",370,40,"#14301f","bold");
    t("CERTIFICADO DE CAPACITACIÓN",470,76,"#0a8a3c","bold");
    t("Se certifica que",545,34,"#14301f");
    let sz=80; x.font="bold "+sz+"px "+F; while(x.measureText(nom).width>1300&&sz>30){sz-=4;x.font="bold "+sz+"px "+F;}
    t(nom,650,sz,"#066b2d","bold");
    x.fillStyle="#ffd400"; x.fillRect(W/2-420,675,840,8);
    t("("+NOMBRE_PERFIL[S.perfil]+")",735,32,"#14301f");
    t("completó la capacitación EduSafe sobre prevención y respuesta",815,38,"#14301f");
    t("ante sismo, incendio y otras emergencias, aprobando todas las pruebas.",865,38,"#14301f");
    t("Fecha: "+new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}),960,34,"#14301f");
    t("Código de verificación: "+S.code,1010,34,"#14301f","bold");
    t("Constancia de participación · EduSafe – SolucionSoft · Yumbo, Valle del Cauca",1085,26,"#5a6b60");
    const blob=pdf(c.toDataURL("image/jpeg",0.92),W,H);
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="Certificado_EduSafe.pdf"; document.body.appendChild(a); a.click(); a.remove();
  };
  img.src=LOGO;
}

/* Crea un PDF (hoja A4 horizontal) con la imagen del certificado, sin librerías externas */
function pdf(dataUrl,w,h){
  const bin=atob(dataUrl.split(",")[1]), im=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) im[i]=bin.charCodeAt(i);
  const W=842,H=595,enc=new TextEncoder(),parts=[],off=[]; let len=0;
  const put=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length;};
  const obj=(n,s)=>{off[n]=len;put(n+" 0 obj\n"+s+"\nendobj\n");};
  put("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  off[4]=len;
  put(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);
  put(im); put("\nendstream\nendobj\n");
  const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=len; let t="xref\n0 6\n0000000000 65535 f \n";
  for(let n=1;n<=5;n++) t+=String(off[n]).padStart(10,"0")+" 00000 n \n";
  put(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}

S.perfil ? inicio() : pantallaPerfil();
</script>
